<title>emanu.info – meine Projekte</title>

<style>
:root{
  --night:#0e2233; --pine:#12302a; --moss:#7fb08a; --mist:#e6f2e8; --lantern:#f6c660; --wood:#7b5232; --wood-d:#4f321d; --wood-l:#a8774a;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans: ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
html{color-scheme:dark}
body{margin:0;min-height:100svh;background:var(--night);color:var(--mist);font-family:var(--sans);line-height:1.5;overflow-x:hidden}
.scene{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.fly{animation:glow 6s ease-in-out infinite;opacity:0}
@keyframes glow{0%,100%{opacity:0;transform:translate(0,0)}40%{opacity:.95}70%{opacity:.4;transform:translate(14px,-18px)}}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(8,22,30,.72) 0%,rgba(8,22,30,.35) 45%,rgba(8,22,30,0) 70%)}
.page{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;padding:0 clamp(16px,5vw,64px)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0}
.brand{font-family:var(--serif);font-size:1.35rem;font-weight:700;letter-spacing:.01em;color:var(--mist);text-decoration:none}
.brand span{color:var(--lantern)}
nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0}
nav a{display:block;padding:8px 14px;border-radius:999px;color:var(--mist);text-decoration:none;font-weight:600;font-size:.95rem}
nav a:hover{background:rgba(230,242,232,.14)}
a:focus-visible{outline:3px solid var(--lantern);outline-offset:3px;border-radius:10px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(8px,4vh,40px) 0 120px;max-width:620px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(2.3rem,6.2vw,4.4rem);line-height:1.05;margin:0 0 14px;text-wrap:balance}
.lead{font-size:clamp(1.02rem,2.2vw,1.2rem);max-width:34em;margin:0 0 34px;color:#d3e6d8}
.trail{position:relative;margin:0;padding:0 0 0 34px;list-style:none;display:grid;gap:14px;max-width:460px}
.trail::before{content:"";position:absolute;left:8px;top:-14px;bottom:-26px;width:14px;border-radius:5px;background:linear-gradient(90deg,var(--wood-d),var(--wood),var(--wood-d));box-shadow:0 6px 18px rgba(0,0,0,.45)}
.sign{position:relative;display:block;padding:15px 84px 15px 20px;margin-left:-30px;color:#fff3df;text-decoration:none;
  background:linear-gradient(180deg,var(--wood-l),var(--wood) 55%,var(--wood-d));
  clip-path:polygon(0 0,calc(100% - 26px) 0,100% 50%,calc(100% - 26px) 100%,0 100%);
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));transition:transform .18s ease}
.trail li:nth-child(1) .sign{transform:rotate(-1.2deg)}
.trail li:nth-child(2) .sign{transform:rotate(.9deg)}
.trail li:nth-child(3) .sign{transform:rotate(-.6deg)}
.trail li:nth-child(4) .sign{transform:rotate(1deg)}
a.sign:hover,a.sign:focus-visible{transform:rotate(0deg) translateX(8px)}
.sign strong{display:block;font-family:var(--serif);font-size:1.28rem;line-height:1.25}
.ver{position:absolute;right:38px;top:50%;transform:translateY(-50%);font-style:normal;font-size:.7rem;font-weight:700;letter-spacing:.03em;color:#f6dca8;opacity:.9;font-variant-numeric:tabular-nums}
.sign.soon .ver{font-weight:600;opacity:.7}
.paths{position:absolute;left:-14px;top:calc(100% - 22px);width:min(560px,92vw);height:auto;pointer-events:none;overflow:visible}
.sign.soon{background:linear-gradient(180deg,#6d5f50,#54473a 55%,#3b3128);color:#e9dccb;cursor:default}
footer{padding:18px 0 22px;font-size:.88rem;color:#b9d2c0}
footer a{color:inherit}
@media (max-width:720px){
  .veil{background:linear-gradient(180deg,rgba(8,22,30,.78) 0%,rgba(8,22,30,.45) 58%,rgba(8,22,30,0) 82%)}
  header{padding:16px 0}
  main{justify-content:flex-start;padding-top:12px}
  .trail{max-width:none}
  nav a{padding:7px 10px;font-size:.9rem}
}
@media (prefers-reduced-motion:reduce){.fly{animation:none;opacity:.6}.sign{transition:none}}
</style>
